// C program for implementation of selection sort 
#include <stdio.h> 

void swap(int *xp, int *yp) 
{ 
	int temp = *xp; 
	*xp = *yp; 
	*yp = temp; 
} 

void selectionSort(int arr[], int n) 
{ 
	int i, j, min_idx; 

	for (i = 0; i < n-1; i++) 
	{
		min_idx = i; 
		for (j = i+1; j < n; j++) 
		if (arr[j] < arr[min_idx]) 
			min_idx = j; 

		if(min_idx != i) 
			swap(&arr[min_idx], &arr[i]); 
	} 
} 

void printArray(int arr[], int size) 
{ 
	int i; 
	for (i=0; i < size; i++) 
		printf("%d ", arr[i]); 
	printf("\n"); 
} 

int main() 
{ 
	int arr[] = {64, 25, 12, 22, 11}; 
	int n = sizeof(arr)/sizeof(arr[0]); 
	selectionSort(arr, n); 
	printf("Sorted array: \n"); 
	printArray(arr, n); 
	return 0; 
}

    // C program for QuickSort
#include <stdio.h>

// Utility function to swap tp integers
void swap(int* p1, int* p2)
{
    int temp;
    temp = *p1;
    *p1 = *p2;
    *p2 = temp;
}

int partition(int arr[], int low, int high)
{
    // choose the pivot
    int pivot = arr[high];

    // Index of smaller element and Indicate
    // the right position of pivot found so far
    int i = (low - 1);

    for (int j = low; j <= high; j++) {
        // If current element is smaller than the pivot
        if (arr[j] < pivot) {
            // Increment index of smaller element
            i++;
            swap(&arr[i], &arr[j]);
        }
    }
    swap(&arr[i + 1], &arr[high]);
    return (i + 1);
}

// The Quicksort function Implement

void quickSort(int arr[], int low, int high)
{
    // when low is less than high
    if (low < high) {
        // pi is the partition return index of pivot

        int pi = partition(arr, low, high);

        // Recursion Call
        // smaller element than pivot goes left and
        // higher element goes right
        quickSort(arr, low, pi - 1);
        quickSort(arr, pi + 1, high);
    }
}

int main()
{
    int arr[] = { 10, 7, 8, 9, 1, 5 };
    int n = sizeof(arr) / sizeof(arr[0]);
  
    // Function call
    quickSort(arr, 0, n - 1);
  
  // Print the sorted array
    printf("Sorted Array\n");
    for (int i = 0; i < n; i++) {
        printf("%d ", arr[i]);
    }
    return 0;
}

void heapify(int arr[], int N, int i)
{
    
    int largest = i;

    int left = 2 * i + 1;

    int right = 2 * i + 2;

    if (left < N && arr[left] > arr[largest])

        largest = left;

    if (right < N && arr[right] > arr[largest])

        largest = right;

    if (largest != i) {

        swap(&arr[i], &arr[largest]);

        heapify(arr, N, largest);
    }
}

void heapSort(int arr[], int N)
{

    for (int i = N / 2 - 1; i >= 0; i--)

        heapify(arr, N, i);

    for (int i = N - 1; i >= 0; i--) {

        swap(&arr[0], &arr[i]);

        heapify(arr, i, 0);
    }
}

void printArray(int arr[], int N)
{
    for (int i = 0; i < N; i++)
        printf("%d ", arr[i]);
    printf("\n");
}

int main()
{

    int N = sizeof(arr) / sizeof(arr[0]);

    // Function call
    heapSort(arr, N);
    printf("Sorted array is\n");
    printArray(arr, N);
}

   Q1 merge
	#include <stdio.h>
#include <time.h>

void merge(int arr[], int left, int mid, int right) {
    int i, j, k;
    int n1 = mid - left + 1;
    int n2 = right - mid;

    int L[n1], R[n2];

    // Copy data to temp arrays
    for(i = 0; i < n1; i++)
        L[i] = arr[left + i];
    for(j = 0; j < n2; j++)
        R[j] = arr[mid + 1 + j];

    i = 0; j = 0; k = left;

    // Merge the temp arrays
    while(i < n1 && j < n2) {
        if(L[i] <= R[j]) {
            arr[k] = L[i];
            i++;
        } else {
            arr[k] = R[j];
            j++;
        }
        k++;
    }

    // Copy remaining elements
    while(i < n1) {
        arr[k] = L[i];
        i++;
        k++;
    }

    while(j < n2) {
        arr[k] = R[j];
        j++;
        k++;
    }
}

void mergeSort(int arr[], int left, int right) {
    if(left < right) {
        int mid = (left + right) / 2;

        mergeSort(arr, left, mid);
        mergeSort(arr, mid + 1, right);

        merge(arr, left, mid, right);
    }
}

int main() {
    int n, i;
    int arr[1000];

    printf("Enter number of elements: ");
    scanf("%d", &n);

    printf("Enter elements:\n");
    for(i = 0; i < n; i++) {
        scanf("%d", &arr[i]);
    }

    clock_t start, end;
    start = clock();

    mergeSort(arr, 0, n - 1);

    end = clock();

    printf("\nSorted array:\n");
    for(i = 0; i < n; i++) {
        printf("%d ", arr[i]);
    }

    double time_taken = ((double)(end - start)) / CLOCKS_PER_SEC;
    printf("\n\nTime taken = %f seconds\n", time_taken);

    return 0;
}

#include <stdio.h>

struct item {
    int w, p;
    float r;
};

int main() {
    int n, i, j;
    float cap, profit = 0;

    printf("Enter number of items: ");
    scanf("%d", &n);

    struct item a[n];

    printf("Enter weight and profit:\n");
    for(i = 0; i < n; i++) {
        scanf("%d %d", &a[i].w, &a[i].p);
        a[i].r = (float)a[i].p / a[i].w;
    }

    printf("Enter capacity: ");
    scanf("%f", &cap);

    // Sort by ratio
    for(i = 0; i < n-1; i++) {
        for(j = i+1; j < n; j++) {
            if(a[i].r < a[j].r) {
                struct item t = a[i];
                a[i] = a[j];
                a[j] = t;
            }
        }
    }

    // Greedy selection
    for(i = 0; i < n; i++) {
        if(cap >= a[i].w) {
            cap -= a[i].w;
            profit += a[i].p;
        } else {
            profit += a[i].r * cap;
            break;
        }
    }

    printf("Max Profit = %.2f", profit);
    return 0;
}

	#include <stdio.h>
int parent[10];

int find(int i) {
    while(parent[i])
        i = parent[i];
    return i;
}

int uni(int i, int j) {
    if(i != j) {
        parent[j] = i;
        return 1;
    }
    return 0;
}

int main() {
    int n, i, j, a, b, u, v;
    int min, mincost = 0;
    int cost[10][10];

    printf("Enter number of vertices: ");
    scanf("%d", &n);

    printf("Enter cost matrix:\n");
    for(i = 0; i < n; i++) {
        for(j = 0; j < n; j++) {
            scanf("%d", &cost[i][j]);
            if(cost[i][j] == 0)
                cost[i][j] = 999;
        }
    }

    printf("\nEdges in MST:\n");

    for(int edge = 0; edge < n - 1; edge++) {
        min = 999;

        for(i = 0; i < n; i++) {
            for(j = 0; j < n; j++) {
                if(cost[i][j] < min) {
                    min = cost[i][j];
                    a = u = i;
                    b = v = j;
                }
            }
        }

        u = find(u);
        v = find(v);

        if(uni(u, v)) {
            printf("%d -> %d = %d\n", a, b, min);
            mincost += min;
        }

        cost[a][b] = cost[b][a] = 999;
    }

    printf("\nMinimum Cost = %d", mincost);

    return 0;
}
Q2 huffman coding
			#include <stdio.h>
#include <stdlib.h>

struct node {
    char ch;
    int freq;
    struct node *left, *right;
};

// Create new node
struct node* newNode(char ch, int freq) {
    struct node* temp = (struct node*)malloc(sizeof(struct node));
    temp->ch = ch;
    temp->freq = freq;
    temp->left = temp->right = NULL;
    return temp;
}

// Print codes
void printCodes(struct node* root, int arr[], int top) {
    if(root->left) {
        arr[top] = 0;
        printCodes(root->left, arr, top + 1);
    }
    if(root->right) {
        arr[top] = 1;
        printCodes(root->right, arr, top + 1);
    }

    if(!root->left && !root->right) {
        printf("%c: ", root->ch);
        for(int i = 0; i < top; i++)
            printf("%d", arr[i]);
        printf("\n");
    }
}

int main() {
    int n, i, j;
    printf("Enter number of characters: ");
    scanf("%d", &n);

    char ch[n];
    int freq[n];

    printf("Enter characters:\n");
    for(i = 0; i < n; i++)
        scanf(" %c", &ch[i]);

    printf("Enter frequencies:\n");
    for(i = 0; i < n; i++)
        scanf("%d", &freq[i]);

    struct node* nodes[n];

    for(i = 0; i < n; i++)
        nodes[i] = newNode(ch[i], freq[i]);

    // Build Huffman Tree (simple method)
    while(n > 1) {
        int min1 = 0, min2 = 1;

        if(nodes[min1]->freq > nodes[min2]->freq) {
            int t = min1; min1 = min2; min2 = t;
        }

        for(i = 2; i < n; i++) {
            if(nodes[i]->freq < nodes[min1]->freq) {
                min2 = min1;
                min1 = i;
            } else if(nodes[i]->freq < nodes[min2]->freq) {
                min2 = i;
            }
        }

        struct node* left = nodes[min1];
        struct node* right = nodes[min2];

        struct node* new = newNode('$', left->freq + right->freq);
        new->left = left;
        new->right = right;

        nodes[min1] = new;
        nodes[min2] = nodes[n - 1];
        n--;
    }

    int arr[100], top = 0;
    printf("\nHuffman Codes:\n");
    printCodes(nodes[0], arr, top);

    return 0;
}

    int i, j;

    printf("Enter first string: ");
    scanf("%s", X);

    printf("Enter second string: ");
    scanf("%s", Y);

    int m = strlen(X);
    int n = strlen(Y);

    int L[m+1][n+1];

    // Build LCS table
    for(i = 0; i <= m; i++) {
        for(j = 0; j <= n; j++) {
            if(i == 0 || j == 0)
                L[i][j] = 0;
            else if(X[i-1] == Y[j-1])
                L[i][j] = 1 + L[i-1][j-1];
            else
                L[i][j] = max(L[i-1][j], L[i][j-1]);
        }
    }

    printf("Length of LCS = %d", L[m][n]);

    return 0;
}

#include <stdio.h>
#define MAX 100
#define INF 9999

int minDistance(int dist[], int visited[], int n) {
    int min = INF, min_index = -1;

    for (int i = 0; i < n; i++) {
        if (!visited[i] && dist[i] <= min) {
            min = dist[i];
            min_index = i;
        }
    }
    return min_index;
}

void dijkstra(int graph[MAX][MAX], int n, int src) {
    int dist[MAX], visited[MAX];

    // Initialize distances and visited array
    for (int i = 0; i < n; i++) {
        dist[i] = INF;
        visited[i] = 0;
    }

    dist[src] = 0;

    // Find shortest path for all vertices
    for (int count = 0; count < n - 1; count++) {
        int u = minDistance(dist, visited, n);
        visited[u] = 1;

        for (int v = 0; v < n; v++) {
            if (!visited[v] && graph[u][v] && 
                dist[u] != INF && 
                dist[u] + graph[u][v] < dist[v]) {
                
                dist[v] = dist[u] + graph[u][v];
            }
        }
    }

    // Print result
    printf("Vertex \t Distance from Source\n");
    for (int i = 0; i < n; i++) {
        printf("%d \t %d\n", i, dist[i]);
    }
}

int main() {
    int n, src;
    int graph[MAX][MAX];

                a[i] = a[j];
                a[j] = t;
            }
        }
    }

    // Greedy selection
    for(i = 0; i < n; i++) {
        if(cap >= a[i].w) {
            cap -= a[i].w;
            profit += a[i].p;
        } else {
            profit += a[i].r * cap;
            break;
        }
    }

    printf("Max Profit = %.2f", profit);
    return 0;
}

void printCodes(struct node* root, int arr[], int top) {
    if(root->left) {
        arr[top] = 0;
        printCodes(root->left, arr, top + 1);
    }
    if(root->right) {
        arr[top] = 1;
        printCodes(root->right, arr, top + 1);
    }

    if(!root->left && !root->right) {

        for(int i = 0; i < top; i++)

    }

        scanf("%d", &freq[i]);

    struct node* nodes[n];

    for(i = 0; i < n; i++)
        nodes[i] = newNode(ch[i], freq[i]);

    // Build Huffman Tree (simple method)
    while(n > 1) {
        int min1 = 0, min2 = 1;

        if(nodes[min1]->freq > nodes[min2]->freq) {
            int t = min1; min1 = min2; min2 = t;
        }

        for(i = 2; i < n; i++) {
            if(nodes[i]->freq < nodes[min1]->freq) {
                min2 = min1;

            } else if(nodes[i]->freq < nodes[min2]->freq) {
                min2 = i;
            }
        }

        struct node* left = nodes[min1];
        struct node* right = nodes[min2];

        struct node* new = newNode('$', left->freq + right->freq);
        new->left = left;
        new->right = right;

        nodes[min1] = new;
        nodes[min2] = nodes[n - 1];
        n--;
    }

    for (int i = 0; i < n; i++) {

struct item {
    int w, p;
    float r;
};

int main() {
    int n, i, j;

        scanf("%d %d", &a[i].w, &a[i].p);
        a[i].r = (float)a[i].p / a[i].w;
    }

    printf("Enter capacity: ");
    scanf("%f", &cap);

    // Sort by ratio
    for(i = 0; i < n-1; i++) {
        for(j = i+1; j < n; j++) {
            if(a[i].r < a[j].r) {
                struct item t = a[i];
                a[i] = a[j];
                a[j] = t;
            }
        }
    }

    // Greedy selection
    for(i = 0; i < n; i++) {
        if(cap >= a[i].w) {
            cap -= a[i].w;
            profit += a[i].p;
        } else {
            profit += a[i].r * cap;
            break;
        }
    }

    printf("Max Profit = %.2f", profit);
    return 0;
}

// Function to simulate node classification
void classify(int start) {
    int queue[10], front = 0, rear = 0;

    queue[rear++] = start;
    visited[start] = 1;

    printf("E-node (Expanding): %d\n", start);

    while(front < rear) {
        int node = queue[front++];
        int hasChild = 0;

        for(int i = 0; i < n; i++) {
            if(graph[node][i] && !visited[i]) {
                printf("Live node: %d\n", i);
                queue[rear++] = i;
                visited[i] = 1;
                hasChild = 1;
            }
        }

        if(!hasChild) {
            printf("Dead node: %d\n", node);
        }
    }
}

#define MAX 100

int adj[MAX][MAX], visited[MAX], stack[MAX];
int n, top = -1;

// Function to perform DFS
void dfs(int v) {
    visited[v] = 1;

    for (int i = 0; i < n; i++) {
        if (adj[v][i] == 1 && !visited[i]) {
            dfs(i);
        }
    }

    // Push vertex onto stack
    stack[++top] = v;
}

// Function for Topological Sort
void topologicalSort() {
    for (int i = 0; i < n; i++) {
        if (!visited[i]) {
            dfs(i);
        }
    }

    printf("Topological ordering:\n");
    while (top != -1) {
        printf("%d ", stack[top--]);
    }
}

<script>
    function copyProgram(elementId, buttonId) {
        // प्रोग्राम कोड असलेला घटक (element) मिळवा
        const elementToCopy = document.getElementById(elementId);
        const button = document.getElementById(buttonId);
        
        // <textarea> मधून टेक्स्ट मिळवा
        const textToCopy = elementToCopy.value; 

        // navigator.clipboard API वापरून टेक्स्ट कॉपी करा
        navigator.clipboard.writeText(textToCopy)
            .then(() => {
                // बटणचा मजकूर तात्पुरता बदलणे (Success feedback)
                const originalText = button.innerText;
                button.innerText = 'copied';'calendar'
    
                button.classList.add('copied');
                
                // 1.5 सेकंदांनंतर बटण पूर्ववत करा
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('copied');
                }, 1500);

            })
            .catch(err => {
                console.error('टेक्स्ट कॉपी करताना त्रुटी आली: ', err);
                alert('कॉपी करण्यात अपयश आले. ब्राउझर सेटिंग्ज तपासा किंवा मॅन्युअली कॉपी करा.');
            });
    }
